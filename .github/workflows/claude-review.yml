name: Claude Automated Code Review
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run Claude Review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Capture the changes made in this PR
          git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > /tmp/diff.txt

          # Ask Claude to review the diff — diff is piped via stdin, not inlined into argv
          claude --print "Review this git diff for code quality, bugs, performance, and security issues. Format your feedback as clean markdown comments referencing the files. Check the API.md, AGENTS.md, README.md and anything in /docs for reference. Formulate your review in french." < /tmp/diff.txt > /tmp/review.md

          # Post the review back to the PR — --body-file avoids the same argv-length risk
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/review.md
